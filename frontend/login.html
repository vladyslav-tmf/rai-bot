<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Login - RAI Bot</title>
  <link rel="stylesheet" href="static/css/auth.css">
</head>

<body>
<div class="auth-container">
  <div class="auth-box">
    <h1>Welcome to RAI Bot</h1>

    <div class="auth-tabs">
      <button id="login-tab" class="tab-button active">Login</button>
      <button id="register-tab" class="tab-button">Register</button>
    </div>

    <div id="login-section" class="auth-section">
      <form id="login-form">
        <div class="form-group">
          <input type="email" placeholder="Email" required>
        </div>
        <div class="form-group">
          <input type="password" placeholder="Password" required>
        </div>
        <button type="submit" class="auth-button">Login</button>
      </form>
    </div>

    <div id="register-section" class="auth-section" style="display: none;">
      <form id="register-form">
        <div class="form-group">
          <input type="email" placeholder="Email" required>
        </div>
        <div class="form-group">
          <input type="password" placeholder="Password" required>
        </div>
        <div class="form-group">
          <input type="password" name="confirm-password" placeholder="Confirm Password"
                 required>
        </div>
        <button type="submit" class="auth-button">Register</button>
      </form>
    </div>
  </div>
</div>
<script src="static/js/auth.js"></script>
</body>

</html>
