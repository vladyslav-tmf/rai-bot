<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Chats - RAI Bot</title>
  <link rel="stylesheet" href="static/css/chats.css">
</head>

<body>
<div class="app-container">
  <header class="app-header">
    <h1>RAI Bot</h1>
    <button id="new-chat-btn" class="new-chat-button">New Chat</button>
    <button id="logout-btn" class="logout-button">Logout</button>
  </header>

  <div class="chats-list" id="chats-list">
  </div>
</div>

<div id="new-chat-modal" class="modal">
  <div class="modal-content">
    <h2>Create New Chat</h2>
    <form id="new-chat-form">
      <div class="form-group">
        <input type="text" id="chat-title" placeholder="Enter chat title" required>
      </div>
      <div class="modal-buttons">
        <button type="button" id="cancel-chat-btn" class="button secondary">Cancel
        </button>
        <button type="submit" class="button primary">Create</button>
      </div>
    </form>
  </div>
</div>

<script src="static/js/chats.js"></script>
</body>

</html>
